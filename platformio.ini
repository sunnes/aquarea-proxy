; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp07]
platform = espressif8266
board = esp07
framework = arduino
; No filesystem is used (Wi-Fi settings are in EEPROM), so shrink the FS area to 64 KB:
; sketch space 761840 -> 958448 bytes, more room for OTA staging. EEPROM address is unchanged.
board_build.ldscript = eagle.flash.1m64.ld
; Passwords and the upload address come from secrets.env (see secrets.env.example).
extra_scripts = pre:scripts/pio_secrets.py

[env:esp07_ota]
extends = env:esp07
upload_protocol = espota
; upload address and --auth are added by scripts/pio_secrets.py
